name: Build and VERIFY Death Compass
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate source layout
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle || { echo 'ERROR: build.gradle missing from repo root'; exit 1; }
          test -f src/main/resources/fabric.mod.json || { echo 'ERROR: fabric.mod.json missing or src folder nested in wrong place'; exit 1; }
          test -f src/main/java/dev/deathcompass/DeathCompass.java || { echo 'ERROR: Java source missing or nested'; exit 1; }
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Compile and package
        run: gradle clean build --stacktrace --console=plain
      - name: Verify mod is actually inside JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified
          count=0
          for jar in build/libs/*.jar; do
            case "$jar" in *-sources.jar|*-dev.jar) continue ;; esac
            if unzip -Z1 "$jar" | grep -qx 'fabric.mod.json' && unzip -Z1 "$jar" | grep -qx 'dev/deathcompass/DeathCompass.class'; then
              python3 - "$jar" <<'PYVERIFY'
import sys, zipfile, json
with zipfile.ZipFile(sys.argv[1]) as z:
  obj = json.loads(z.read('fabric.mod.json'))
  assert obj.get('id') == 'deathcompass', obj
  assert obj.get('entrypoints', {}).get('client') == ['dev.deathcompass.DeathCompass'], obj
  print('Verified Fabric mod metadata and compiled entrypoint:', sys.argv[1])
PYVERIFY
              cp "$jar" verified/
              count=$((count+1))
            fi
          done
          test "$count" -eq 1 || { echo 'ERROR: Expected one playable JAR with Fabric metadata and main class, found' "$count"; exit 1; }
      - name: Download verified mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeathCompass-VERIFIED-JAR
          path: verified/*.jar
          if-no-files-found: error
