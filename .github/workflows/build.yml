name: Build and Verify Death Compass

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build mod
        run: gradle clean build --stacktrace --console=plain

      - name: Verify playable Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified
          count=0
          shopt -s nullglob
          for jar in build/libs/*.jar; do
            case "$jar" in *-sources.jar|*-dev.jar) continue ;; esac
            if python3 scripts/verify_mod_jar.py "$jar"; then
              cp "$jar" verified/
              count=$((count + 1))
            fi
          done
          if [ "$count" -ne 1 ]; then
            echo "ERROR: Expected exactly one valid Death Compass Fabric mod JAR; found $count"
            exit 1
          fi
          echo "Verified Fabric JAR in verified/"

      - name: Upload verified JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeathCompass-VERIFIED-JAR
          path: verified/*.jar
          if-no-files-found: error
